<!DOCTYPE html>
    <html lang="en">
    <head>
      <title>WS05</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
       <header>
  <h1>My Website</h1>
 
</header>

<main>
 
<div class="responsive-container">
      <div class="column">Column 1</div>
      <div class="column">Column 2</div>
    </div>

<img src="Smile.png" alt="Responsive Image" class="responsive-image">

<div class="media-query-box">Resize the window to see the effect</div>

<nav class="responsive-nav">
      <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="nav-list">☰ Menu</button>
        <ul class="nav-list" id="nav-list">
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

</main>

<footer>
  <p>Copyright 2026</p>
</footer>

<script>
  const menuButton = document.querySelector(".menu-toggle");

  menuButton.addEventListener("click", () => {
    const isOpen = menuButton.getAttribute("aria-expanded") === "true";
    menuButton.setAttribute("aria-expanded", String(!isOpen));
  });
</script>

    </body>
    </html>
